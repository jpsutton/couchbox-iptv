name: couchbox_iptv
description: "Free internet TV with a channel guide, for couchbox"
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  args: ^2.7.0
  dbus: ^0.8.0
  path: ^1.9.1
  sqlite3: ^3.7.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Use the system libsqlite3 (Arch's sqlite package) rather than a bundled copy.
hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  uses-material-design: true
